server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # ── Auth Service: protected endpoint (doctor registration — ADMIN only) ──
        - id: auth-register-doctor
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/register/doctor
          filters:
            - name: JwtFilter

        # ── Auth Service: protected endpoint (staff registration — ADMIN only) ──
        - id: auth-register-staff
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/register/staff
          filters:
            - name: JwtFilter

        # ── Auth Service: public endpoints (no JWT required) ──
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # ── Doctor Service (JWT required) ──
        - id: doctor-service
          uri: lb://doctor-service
          predicates:
            - Path=/api/v1/doctors/**
          filters:
            - name: JwtFilter

        # ── Patient Service (JWT required) ──
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/v1/patients/**
          filters:
            - name: JwtFilter

        # ── Staff Service (JWT required) ──
        - id: staff-service
          uri: lb://staff-service
          predicates:
            - Path=/api/v1/staff/**
          filters:
            - name: JwtFilter

        # ── Appointment Service (JWT required) ──
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/v1/appointments/**
          filters:
            - name: JwtFilter

        # ── Payment Service (JWT required) ──
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments, /api/v1/payments/**
          filters:
            - name: JwtFilter

        # ── Notification Service (internal — no JWT, not exposed publicly) ──
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtFilter

        # ── WebSocket (STOMP) — no JWT, auth handled inside STOMP CONNECT ──
        - id: websocket-route
          uri: lb://notification-service
          predicates:
            - Path=/ws/**

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

